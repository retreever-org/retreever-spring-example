<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <title>Retreever Experience Studio</title>

    <style>
        :root {
            --bg: #101010;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --muted-soft: #8b8b95;
            --brand: #3b82f6;
            --brand-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: #101010;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                    radial-gradient(circle at 50% 36%, rgba(59, 130, 246, 0.10), transparent 34%),
                    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: auto, 56px 56px, 56px 56px;
            opacity: 0.85;
        }

        main {
            position: relative;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .entry {
            width: min(760px, 100%);
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #d4d4d8;
            font-size: 0.84rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .brand-mark {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--brand);
            box-shadow: 0 0 18px rgba(59, 130, 246, 0.7);
            flex: 0 0 auto;
        }

        .brand-text {
            line-height: 1;
            white-space: nowrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 5vw, 4.8rem);
            line-height: 0.98;
            letter-spacing: -0.06em;
            font-weight: 760;
        }

        p {
            width: min(1080px, 100%);
            margin: 28px auto 0;
            color: var(--muted);
            font-size: clamp(1.1rem, 1.8vw, 1.35rem);
            line-height: 1.8;
        }

        .action {
            margin-top: 42px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            padding: 0 24px;
            border-radius: 12px;
            border: 1px solid rgba(96, 165, 250, 0.35);
            background: var(--brand);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(59, 130, 246, 0.22);
            transition: background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        }

        .button:hover {
            background: var(--brand-hover);
            transform: translateY(-1px);
            box-shadow: 0 16px 34px rgba(59, 130, 246, 0.28);
        }

        .button:focus-visible {
            outline: 3px solid rgba(59, 130, 246, 0.34);
            outline-offset: 4px;
        }

        @media (max-width: 640px) {
            main {
                padding: 20px;
            }

            .brand {
                gap: 10px;
                margin-bottom: 24px;
                padding: 9px 14px;
                font-size: 0.74rem;
                letter-spacing: 0.14em;
            }

            h1 {
                font-size: clamp(2.3rem, 12vw, 3.5rem);
            }

            p {
                margin-top: 20px;
                font-size: 1rem;
                line-height: 1.75;
            }

            .action {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>
<main>
    <section class="entry" aria-labelledby="title">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-text">Retreever Experience Studio</span>
        </div>

        <h1 id="title">Explore Retreever live</h1>

        <p>
            This app is installed with Retreever and running on a real server.
            Open the Studio to explore runtime-generated API docs, send live requests, and try automation flows.
        </p>

        <div class="action">
            <a class="button" href="/retreever">Explore Studio</a>
        </div>
    </section>
</main>
</body>
</html>
