<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <link rel="icon" type="image/png" href="/assets/icon192v2.png">
    <link rel="apple-touch-icon" href="/assets/icon192v2.png">
    <title>Retreever API Studio</title>

    <style>
        :root {
            --bg: #101010;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --muted-soft: #8b8b95;
            --brand: #3b82f6;
            --brand-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: #101010;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                    radial-gradient(circle at 50% 36%, rgba(59, 130, 246, 0.10), transparent 34%),
                    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: auto, 56px 56px, 56px 56px;
            opacity: 0.85;
        }

        main {
            position: relative;
            height: 100dvh;
            max-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 24px 28px;
        }

        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            width: 100%;
            flex: 0 0 auto;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0;
            color: #d4d4d8;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .content {
            flex: 1 1 auto;
            display: grid;
            place-items: center;
            min-height: 0;
        }

        .entry {
            width: min(760px, 100%);
            text-align: center;
        }

        .brand-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            flex: 0 0 auto;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            line-height: 1.05;
        }

        .brand-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #f4f4f5;
        }

        .brand-text {
            margin-top: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #a1a1aa;
            line-height: 1;
            white-space: nowrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 5vw, 4.8rem);
            line-height: 0.98;
            letter-spacing: -0.06em;
            font-weight: 760;
        }

        p {
            width: min(720px, 100%);
            margin: 28px auto 0;
            color: var(--muted);
            font-size: clamp(0.9rem, 1vw, 0.84rem);
            line-height: 1.7;
        }

        .action {
            margin-top: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            padding: 0 24px;
            border-radius: 100px;
            border: 1px solid rgba(96, 165, 250, 0.35);
            background: var(--brand);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(59, 130, 246, 0.22);
            transition: background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        }

        .button:hover {
            background: var(--brand-hover);
            transform: translateY(-1px);
            box-shadow: 0 16px 34px rgba(59, 130, 246, 0.28);
        }

        .button:focus-visible {
            outline: 3px solid rgba(59, 130, 246, 0.34);
            outline-offset: 4px;
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.14);
            color: var(--text);
            box-shadow: none;
        }

        .button-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.18);
        }

        @media (max-width: 640px) {
            main {
                padding: 20px;
            }

            .brand {
                gap: 10px;
            }

            .brand-icon-wrap {
                width: 42px;
                height: 42px;
            }

            .brand-icon {
                width: 28px;
                height: 28px;
            }

            .brand-title {
                font-size: 0.92rem;
            }

            .brand-text {
                font-size: 0.67rem;
                letter-spacing: 0.14em;
            }

            h1 {
                font-size: clamp(2.3rem, 12vw, 3.5rem);
            }

            p {
                margin-top: 20px;
                font-size: 0.72rem;
                line-height: 1.65;
            }

            .action {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>
<main>
    <div class="topbar">
        <div class="brand">
            <span class="brand-icon-wrap" aria-hidden="true">
                <img class="brand-icon" src="./assets/icon192v2.png" alt="">
            </span>
            <span class="brand-copy">
                <span class="brand-title">Retreever</span>
                <span class="brand-text">API Studio</span>
            </span>
        </div>
    </div>

    <section class="content">
        <div class="entry" aria-labelledby="title">
            <h1 id="title">Explore Retreever live</h1>

            <p>
                Hey, this is a Retreever-hosted experience studio where you can explore sample APIs,
                test live flows, see how everything works together, and share your thoughts at
                hello@retreever.dev.
            </p>

            <div class="action">
                <a class="button" href="/retreever">Explore Studio</a>
                <a class="button button-secondary" href="https://docs.retreever.dev" target="_blank" rel="noreferrer">
                    Try Retreever
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
