spring:
  application:
    name: retreever-example

server:
  port: ${PORT:${SERVER_PORT:9000}}
  # since the app runs in cloud run
  # and reverse proxy is applied terminating TLS before reaching the app
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: INFO

# ================================== Retreever Properties | Start ==================================

retreever:
  enabled: true
  security:
    hint-log: false
  auth:
    username: ${RETREEVER_AUTH_USERNAME:}
    password: ${RETREEVER_AUTH_PASSWORD:}
    secure-cookies: ${RETREEVER_AUTH_SECURE_COOKIES:true}
  studio:
    storage: indexed-db

# ============================= Retreever Properties | Env Automation ==============================

  env:
    variables:

      - name: access-token
        source:
          request:
            endpoints:
              - /api/v1/public/login
              - /api/v1/public/login/refresh
            method: post
            response:
              body-attribute-path: data.access_token

      - name: refresh-token
        source:
          request:
            endpoints:
            - /api/v1/public/login
            - /api/v1/public/login/refresh
            method: post
            response:
              body-attribute-path: data.refresh_token

# # ================================== Retreever Properties | End ==================================

app:
  device-cookie:
    secret: ${RETREEVER_EXAMPLE_DEVICE_COOKIE_SECRET:retreever-example-device-cookie-secret-change-me}
  rate-limit:
    request:
      per-minute: ${RETREEVER_EXAMPLE_REQUESTS_PER_MINUTE:20}
      per-day: ${RETREEVER_EXAMPLE_REQUESTS_PER_DAY:500}
    upload:
      per-minute: ${RETREEVER_EXAMPLE_UPLOADS_PER_MINUTE:2}
      per-day: ${RETREEVER_EXAMPLE_UPLOADS_PER_DAY:20}
  retention:
    max-age: ${RETREEVER_EXAMPLE_RETENTION_MAX_AGE:PT5H}
  dev:
    allow-cross-origin: ${RETREEVER_DEV_ALLOW_CROSS_ORIGIN:}
  frame-ancestors: ${RETREEVER_EXAMPLE_FRAME_ANCESTORS:}
