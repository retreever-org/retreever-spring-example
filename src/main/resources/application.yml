spring:
  application:
    name: retreever-example

server:
  port: ${PORT:${SERVER_PORT:9000}}

logging:
  level:
    org.springframework.security: INFO

# Retreever Environment Configuration
retreever:
  enabled: true
  auth:
    username: ${RETREEVER_AUTH_USERNAME:}
    password: ${RETREEVER_AUTH_PASSWORD:}
    secure-cookies: ${RETREEVER_AUTH_SECURE_COOKIES:true}
  security:
    hint-log: false
#  studio:
#    storage: indexed-db

# Applicable only for the internal applications only. Host applications need not have to set these.
  dev:
    allow-cross-origin: ${RETREEVER_DEV_ALLOW_CROSS_ORIGIN:}

# ----------------- Environment Variable Automation ------------------
  env:
    variables:

      - name: access-token
        source:
          request:
            endpoints:
              - /api/v1/public/login
              - /api/v1/public/login/refresh
            method: post
            response:
              body-attribute-path: data.access_token

      - name: refresh-token
        source:
          request:
            endpoints:
            - /api/v1/public/login
            - /api/v1/public/login/refresh
            method: post
            response:
              body-attribute-path: data.refresh_token
