spring:
  application:
    name: retreever-example

server:
  port: 9000

logging:
  level:
    org.springframework.security: INFO

# Retreever Environment Configuration
retreever:
  enabled: true
  example:
    frame-ancestors: ${RETREEVER_FRAME_ANCESTORS:}
  dev:
    allow-cross-origin: ${RETREEVER_DEV_ALLOW_CROSS_ORIGIN:}
  studio:
    storage: indexed-db
  security:
    hint-log: false
  auth:
    username: ${RETREEVER_AUTH_USERNAME:}
    password: ${RETREEVER_AUTH_PASSWORD:}

# Environment Variable Automation
  env:
    variables:

      - name: access-token
        source:
          request:
            endpoints:
              - /api/v1/public/login
              - /api/v1/public/login/refresh
            method: post
            response:
              body-attribute-path: data.access_token

      - name: refresh-token
        source:
          request:
            endpoints:
            - /api/v1/public/login
            - /api/v1/public/login/refresh
            method: post
            response:
              body-attribute-path: data.refresh_token
