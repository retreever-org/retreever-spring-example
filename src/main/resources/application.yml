spring:
  application:
    name: retreever-example

server:
  port: 9000

logging:
  level:
    org.springframework.security: INFO

# Retreever Environment Configuration
retreever:
  enabled: true
  dev:
    allow-cross-origin:
      - http://localhost:5173
  studio:
    storage: indexed-db
  security:
    hint-log: false
  auth:
#    username: Admin # can be in .env
#    password: Admin@123 # can be in .env
  env:
    variables:

      - name: access-token
        source:
          request:
            endpoints:
              - /api/v1/public/login
              - /api/v1/public/login/refresh
            method: post
            response:
              body-attribute-path: data.access_token

      - name: refresh-token
        source:
          request:
            endpoints:
            - /api/v1/public/login
            - /api/v1/public/login/refresh
            method: post
            response:
              body-attribute-path: data.refresh_token

      - name: device-id
        source:
          value: device-web-001
